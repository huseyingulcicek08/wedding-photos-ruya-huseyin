<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rüya & Hüseyin Düğün Fotoğrafları</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; }
        img { width: 200px; margin: 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <h1>Rüya & Hüseyin Düğün Fotoğrafları</h1>
    <h2>Fotoğraf Yükleme</h2>
    <form id="photoForm">
        <label for="name">Adınız Soyadınız:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="file">Fotoğraf Seçin:</label><br>
        <input type="file" id="file" accept="image/*" required><br><br>
        <button type="submit">Yükle</button>
    </form>

    <h2>Yüklediğiniz Fotoğraflar</h2>
    <div id="photoList"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCapg1w_XmwBM16kpbkO5FfHDomxCWlwQ",
            authDomain: "wedding-photos-ruya-huseyin.firebaseapp.com",
            projectId: "wedding-photos-ruya-huseyin",
            storageBucket: "wedding-photos-ruya-huseyin.appspot.com",
            messagingSenderId: "416637618961",
            appId: "1:416637618961:web:449ebaf099caa511791ab0",
            measurementId: "G-4Y7FT9LYRC"
        };

        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();

        const photoForm = document.getElementById('photoForm');
        const photoList = document.getElementById('photoList');

        let uploadedPhotos = [];

        photoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const file = document.getElementById('file').files[0];

            const filePath = 'user_uploads/' + Date.now() + '_' + file.name;
            const storageRef = storage.ref(filePath);
            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed', null,
                (error) => {
                    console.error('Yükleme hatası:', error);
                    alert('Yükleme başarısız oldu.');
                },
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        uploadedPhotos.push(downloadURL);
                        displayPhotos();
                        alert('Fotoğraf başarıyla yüklendi!');
                    });
                }
            );
        });

        function displayPhotos() {
            photoList.innerHTML = '';
            uploadedPhotos.forEach((url) => {
                const img = document.createElement('img');
                img.src = url;
                photoList.appendChild(img);
            });
        }
    </script>
</body>
</html>
