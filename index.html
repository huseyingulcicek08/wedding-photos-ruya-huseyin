<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rüya & Hüseyin Düğün Fotoğrafları</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        img { width: 200px; margin: 10px; border-radius: 10px; border: 2px solid #ccc; }
        #photoList { display: flex; flex-wrap: wrap; justify-content: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>
</head>
<body>
    <h1>Rüya & Hüseyin Düğün Fotoğrafları</h1>
    <h2>Fotoğraf Yükleme</h2>
    <form id="photoForm">
        <label for="name">Adınız Soyadınız:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="file">Fotoğraf Seçin:</label>
        <input type="file" id="file" required><br><br>
        <button type="submit">Yükle</button>
    </form>

    <h2>Yüklenen Fotoğraflar</h2>
    <div id="photoList"></div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCCapg1w_XmwBM16kpbkO5FfHDomxCWlwQ",
            authDomain: "wedding-photos-ruya-huseyin.firebaseapp.com",
            projectId: "wedding-photos-ruya-huseyin",
            storageBucket: "wedding-photos-ruya-huseyin.appspot.com",
            messagingSenderId: "416637618961",
            appId: "1:416637618961:web:449ebaf099caa511791ab0",
            measurementId: "G-4Y7FT9LYRC"
        };

        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();

        const photoForm = document.getElementById('photoForm');
        const photoList = document.getElementById('photoList');

        // Fotoğrafları yükle
        photoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const file = document.getElementById('file').files[0];
            if (!file) {
                alert("Lütfen bir fotoğraf seçin.");
                return;
            }

            const timestamp = Date.now();
            const storageRef = storage.ref('photos/' + timestamp + '_' + name + '_' + file.name);
            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed', 
                (snapshot) => { /* İlerleme göstergesi istersen buraya ekleyebilirim */ },
                (error) => {
                    console.log('Yükleme hatası:', error);
                    alert('Yükleme sırasında bir hata oluştu.');
                },
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        addPhotoToList(downloadURL);
                        alert('Fotoğraf başarıyla yüklendi!');
                    });
                }
            );
        });

        // Fotoğrafları listele
        const fetchPhotos = async () => {
            photoList.innerHTML = '';
            const listRef = storage.ref('photos');
            const res = await listRef.listAll();
            res.items.forEach(async (itemRef) => {
                const url = await itemRef.getDownloadURL();
                addPhotoToList(url);
            });
        };

        // Fotoğrafı listeye ekle
        const addPhotoToList = (url) => {
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Yüklenen Fotoğraf';
            img.onclick = () => window.open(url, '_blank');
            photoList.appendChild(img);
        };

        // Sayfa yüklendiğinde fotoğrafları getir
        fetchPhotos();
    </script>
</body>
</html>
